services:
  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: merge_duplicates
      MYSQL_USER: merge
      MYSQL_PASSWORD: secret
    ports:
      - '3308:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-psecret']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: merge_duplicates
      POSTGRES_USER: merge
      POSTGRES_PASSWORD: secret
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U merge -d merge_duplicates']
      interval: 5s
      timeout: 5s
      retries: 20
