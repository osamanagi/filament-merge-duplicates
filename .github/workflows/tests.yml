name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pint and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: ${{ matrix.lane }} - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: merge_duplicates
          MYSQL_USER: merge
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: merge_duplicates
          POSTGRES_USER: merge
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U merge -d merge_duplicates"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        lane: [f4-lowest, f4-current, f5-lowest, f5-current]
        include:
          - lane: f4-lowest
            constraint: '^4.0'
            flags: '--prefer-lowest'
          - lane: f4-current
            constraint: '^4.0'
            flags: ''
          - lane: f5-lowest
            constraint: '^5.0'
            flags: '--prefer-lowest'
          - lane: f5-current
            constraint: '^5.0'
            flags: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Pin the Filament major under test
        run: composer require --no-interaction --no-update "filament/filament:${{ matrix.constraint }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.flags }}

      - name: Record resolved versions
        run: |
          php -r '
              $lock = json_decode(file_get_contents("composer.lock"), true);
              $packages = array_merge($lock["packages"], $lock["packages-dev"]);
              $wanted = ["filament/filament", "laravel/framework", "livewire/livewire", "orchestra/testbench", "pestphp/pest"];
              $map = [];
              foreach ($packages as $package) { $map[$package["name"]] = $package["version"]; }
              foreach ($wanted as $name) { printf("%-24s %s\n", $name, $map[$name] ?? "ABSENT"); }
          '

      - name: Execute tests
        # Coverage is measured by the dedicated coverage job, which is the only
        # job that provisions a coverage driver. Pest's --ci flag requests
        # coverage, so the lanes must not use it.
        run: vendor/bin/pest --no-coverage --colors=never

  coverage:
    name: Coverage draft (${{ matrix.lane }})
    runs-on: ubuntu-latest

    # The 100% src/ line coverage gate is a release requirement at M7. Until then
    # this job measures and reports so regressions stay visible without blocking
    # every milestone PR. The command still carries --min=100 so the threshold is
    # explicit and cannot be quietly weakened; this job becomes blocking at M7.
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        lane: [filament-4, filament-5]
        include:
          - lane: filament-4
            constraint: '^4.0'
          - lane: filament-5
            constraint: '^5.0'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: merge_duplicates
          MYSQL_USER: merge
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: merge_duplicates
          POSTGRES_USER: merge
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U merge -d merge_duplicates"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Pin the Filament major under test
        run: composer require --no-interaction --no-update "filament/filament:${{ matrix.constraint }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Measure coverage
        run: vendor/bin/pest --coverage --min=100 --colors=never

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.lane }}
          path: |
            build/coverage
            build/coverage.txt
            build/logs/clover.xml
          if-no-files-found: warn
